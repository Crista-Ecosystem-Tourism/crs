server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /graph-api/ {
        proxy_pass http://placesweb:8003/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Краулеры (в т.ч. https://app.travelpayouts.com/) дёргают /favicon.ico|.svg
    # хардкодом — отдаём наш SVG, чтобы не было 404 в логах.
    location = /favicon.ico { try_files /crista.svg =204; access_log off; log_not_found off; }
    location = /favicon.svg { try_files /crista.svg =204; access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
