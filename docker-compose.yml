services:

  # ── PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: crs_agent
    ports:
      - "5545:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── ChromaDB ────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    restart: unless-stopped
    ports:
      - "8010:8000"
    volumes:
      - chromadata:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "false"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8000'"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Vectorization Backend (RAG) ─────────────────────────
  vectorization:
    build: ./vectorization_backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      EMBEDDING_PROVIDER: huggingface
      EMBEDDING_MODEL_NAME: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      NO_PROXY: "*"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
    depends_on:
      chromadb:
        condition: service_healthy

  # ── PlacesWeb Backend (Graph) ───────────────────────────
  placesweb:
    build: ./placesweb_backend
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      NO_PROXY: "*"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""

  # ── AI Agent Backend ────────────────────────────────────
  ai_agent:
    build: ./ai_agent
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres123@postgres:5432/crs_agent
      CORS_ORIGINS: http://localhost:3333,http://localhost:5173
      RAG_URL: http://vectorization:8001
      ROUTE_URL: http://placesweb:8003
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-me}
      NO_PROXY: "*"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
    depends_on:
      postgres:
        condition: service_healthy

  # ── Frontend ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8002
        VITE_USE_MOCKS: "false"
    restart: unless-stopped
    ports:
      - "3333:3333"
    depends_on:
      - ai_agent

volumes:
  pgdata:
  chromadata:
