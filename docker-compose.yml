services:

  # ── PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: crs_agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── ChromaDB ────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - chromadata:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "false"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8000'"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ── Vectorization Backend (RAG) ─────────────────────────
  vectorization:
    build: ./vectorization_backend
    restart: unless-stopped
    environment:
      EMBEDDING_PROVIDER: huggingface
      EMBEDDING_MODEL_NAME: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      NO_PROXY: "*"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
    depends_on:
      chromadb:
        condition: service_healthy

  # ── PlacesWeb Backend (Graph) ───────────────────────────
  # Без порта на хост: снаружи только через /graph-api/ на фронте (см. frontend/nginx.conf)
  placesweb:
    build: ./placesweb_backend
    restart: unless-stopped
    environment:
      NO_PROXY: "*"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""

  # ── AI Agent Backend ────────────────────────────────────
  ai_agent:
    build: ./ai_agent
    restart: unless-stopped
    ports:
      - "${COMPOSE_LAN_BIND:-127.0.0.1}:8002:8002"
    environment:
      # DSN: DATABASE_URL или сборка из POSTGRES_* (app/db/dsn.py).
      # Coolify не делает substitution ${VAR} внутри environment: compose, поэтому склеенный
      # DATABASE_URL ломал asyncpg. Если хочешь явно — задай DATABASE_URL в Coolify целиком.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: crs_agent
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3333,http://localhost:5173,https://crista.online,https://www.crista.online,https://api.crista.online}
      RAG_URL: http://vectorization:8001
      ROUTE_URL: http://placesweb:8003
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-me}
      NO_PROXY: "*"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8002/health\", timeout=3)'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  # ── Suitcase Backend (мобильное приложение + веб-раздел "Мой чемодан") ──
  suitcase_backend:
    build: ./suitcase/backend
    restart: unless-stopped
    ports:
      - "${COMPOSE_LAN_BIND:-127.0.0.1}:8010:8010"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: crs_agent
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3333,http://localhost:5173,https://crista.online,https://www.crista.online,https://api.crista.online}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-me}
      JWT_EXPIRES_MIN: ${JWT_EXPIRES_MIN:-60}
      NO_PROXY: "*"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
    depends_on:
      ai_agent:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8010/health\", timeout=3)'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  # ── Data Backend (ETL + наполнение Chroma) ─────────────
  data_backend:
    build: ./data_backend
    restart: unless-stopped
    ports:
      - "${COMPOSE_LAN_BIND:-127.0.0.1}:8004:8004"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: crs_agent
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3333,http://localhost:5173,https://crista.online,https://www.crista.online,https://api.crista.online}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-me}
      VECTORIZATION_URL: http://vectorization:8001
      DATA_SEED_DIR: /app/data/seed
      DATA_AUTO_BOOTSTRAP: ${DATA_AUTO_BOOTSTRAP:-false}
      DATA_DISABLE_CRON: ${DATA_DISABLE_CRON:-false}
      DATA_WEEKLY_CRON: ${DATA_WEEKLY_CRON:-0 3 * * 0}
      DATA_REINDEX_CRON: ${DATA_REINDEX_CRON:-30 4 * * *}
      DATA_ADMIN_TOKEN: ${DATA_ADMIN_TOKEN:-}
      OVERPASS_ENDPOINT: ${OVERPASS_ENDPOINT:-https://overpass-api.de/api/interpreter}
      WIKIDATA_ENDPOINT: ${WIKIDATA_ENDPOINT:-https://query.wikidata.org/sparql}
      KUDAGO_ENDPOINT: ${KUDAGO_ENDPOINT:-https://kudago.com/public-api/v1.4}
      DATA_USER_AGENT: ${DATA_USER_AGENT:-CristaDataBackend/1.0 (+https://crista.online; contact@crista.online)}
      NO_PROXY: "*"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
    volumes:
      - data_seed:/app/data/seed
    depends_on:
      postgres:
        condition: service_healthy
      vectorization:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8004/health\", timeout=3)'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  # ── pgAdmin 4 (веб-UI для PostgreSQL) ───────────────────
  pgadmin:
    image: dpage/pgadmin4:8.14
    restart: unless-stopped
    environment:
      # .local не принимает pgAdmin 8.14+ (валидация email)
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change-me}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # ── Frontend ────────────────────────────────────────────
  # 127.0.0.1 — только с этой машины. Для VPS: COMPOSE_LAN_BIND=0.0.0.0 в .env
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_GRAPH_API_URL: /graph-api
        VITE_SUITCASE_API_URL: /suitcase-api
        VITE_USE_MOCKS: "false"
    restart: unless-stopped
    ports:
      - "${COMPOSE_LAN_BIND:-127.0.0.1}:3333:80"
    depends_on:
      - ai_agent
      - placesweb
      - suitcase_backend
      - data_backend

volumes:
  pgdata:
  chromadata:
  pgadmin_data:
  data_seed:
