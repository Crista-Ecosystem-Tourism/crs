# Переиспользуемый security-сканер для всех репо экосистемы.
# Вызывается из crs (на push/PR/cron) и из дочерних репо (на push/PR).
#
# Результаты: Actions → конкретный запуск → вкладка "Summary" (Step Summary).
# GitHub Advanced Security (GHAS) НЕ требуется — работает на бесплатном плане с приватными репо.
#
# Политика блокировки:
# - Trivy: CRITICAL/HIGH с доступным фиксом (ignore-unfixed) → exit 1.
# - Semgrep: findings уровня ERROR → exit 1.

name: Reusable — security scan (Trivy + Semgrep)

on:
  workflow_call: {}

jobs:
  trivy:
    name: Trivy (deps + secrets + IaC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # 1) Полный отчёт (CRITICAL/HIGH/MEDIUM) → Step Summary. Не валит CI.
      - name: Trivy — full report → Step Summary
        uses: aquasecurity/trivy-action@v0.32.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0

      # Пишем итог в Step Summary
      - name: Write Trivy summary
        if: always()
        run: |
          echo "## 🔍 Trivy — deps · secrets · IaC" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Severity filter: **CRITICAL · HIGH · MEDIUM**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See full output in the job log above ↑" >> $GITHUB_STEP_SUMMARY

      # 2) Блокирующий гейт — только фиксируемые CRITICAL/HIGH. Валит CI.
      - name: Trivy — blocking gate (CRITICAL/HIGH, fixable)
        uses: aquasecurity/trivy-action@v0.32.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

  semgrep:
    name: Semgrep (code vulnerabilities)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      # Сохраняем вывод в файл чтобы потом положить в Step Summary.
      # Используем $? вместо ${PIPESTATUS[0]} — совместимо с Alpine sh.
      - name: Semgrep scan (--error → блокирует на ERROR)
        id: semgrep
        shell: sh
        run: |
          set +e
          semgrep scan \
            --config p/python \
            --config p/javascript \
            --config p/typescript \
            --config p/docker \
            --config p/secrets \
            --config p/owasp-top-ten \
            --text \
            --severity ERROR \
            --error \
            2>&1 | tee /tmp/semgrep-out.txt
          EXIT_CODE=$?
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

      - name: Write Semgrep summary
        if: always()
        shell: sh
        run: |
          echo "## 🔍 Semgrep — code vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          tail -40 /tmp/semgrep-out.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      # Propagate non-zero exit (блокировка CI)
      - name: Fail if Semgrep found errors
        if: steps.semgrep.outputs.exit_code != '0'
        shell: sh
        run: exit 1
