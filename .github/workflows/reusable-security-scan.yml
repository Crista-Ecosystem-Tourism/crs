# Переиспользуемый security-сканер для всех репо экосистемы.
# Вызывается из crs (на push/PR/cron) и из дочерних репо (на push/PR).
#
# Результаты: Actions → конкретный запуск → вкладка "Summary" (Step Summary).
# GitHub Advanced Security (GHAS) НЕ требуется — работает на бесплатном плане с приватными репо.
#
# Политика блокировки:
# - Semgrep: findings уровня ERROR → exit 1.

name: Reusable — security scan (Semgrep)

on:
  workflow_call: {}

jobs:
  semgrep:
    name: Semgrep (code vulnerabilities)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      # Сохраняем вывод в файл чтобы потом положить в Step Summary. Не пускаем
      # scanner через pipe: в POSIX sh `$?` после `| tee` — это код tee, а не
      # Semgrep. Иначе ERROR-findings могли не заблокировать workflow.
      - name: Semgrep scan (--error → блокирует на ERROR)
        id: semgrep
        shell: sh
        run: |
          set +e
          semgrep scan \
            --config p/python \
            --config p/javascript \
            --config p/typescript \
            --config p/docker \
            --config p/secrets \
            --config p/owasp-top-ten \
            --text \
            --severity ERROR \
            --error \
            > /tmp/semgrep-out.txt 2>&1
          EXIT_CODE=$?
          cat /tmp/semgrep-out.txt
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

      - name: Write Semgrep summary
        if: always()
        shell: sh
        run: |
          echo "## 🔍 Semgrep — code vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          tail -40 /tmp/semgrep-out.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      # Propagate non-zero exit (блокировка CI)
      - name: Fail if Semgrep found errors
        if: steps.semgrep.outputs.exit_code != '0'
        shell: sh
        run: exit 1
