# Ручной fallback-деплой в Coolify.
#
# Основной prod-деплой теперь идёт через scripts/prebuild-and-deploy.sh на VPS:
# сначала локально собираются images, потом вызывается Coolify webhook.
# Не запускаем Coolify на каждый push, чтобы deploy не ушёл до prebuild.
#
# Секреты (Settings → Secrets → Actions):
# - COOLIFY_DEPLOY_WEBHOOK — полный URL: Webhooks → Deploy Webhook
# - COOLIFY_TOKEN — API token (Keys & Tokens)
#
# 401/403: у токена в Coolify открой IP allowlist: 0.0.0.0/0 (или пусто), иначе GitHub
# Actions не в whitelist. Права: * (root), не read-only. Без лишнего \n в конце в секрете.
#
# См.: https://coolify.io/docs/applications/ci-cd/github/actions

name: Coolify — ручной деплой

on:
  workflow_dispatch:

concurrency:
  group: coolify-crs-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Триггер Coolify
        env:
          WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          WEBHOOK=$(printf '%s' "${WEBHOOK:-}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          TOKEN=$(printf '%s' "${TOKEN:-}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -z "$WEBHOOK" ]; then
            echo "Задай COOLIFY_DEPLOY_WEBHOOK в crs — пока пропуск."
            exit 0
          fi
          http_ok() { [ -n "$1" ] && [ "$1" -ge 200 ] 2>/dev/null && [ "$1" -lt 300 ] 2>/dev/null; }

          set +e
          OK=0
          if [ -n "$TOKEN" ]; then
            HTTP=$(curl -sS -o /tmp/coolify.rsp -w "%{http_code}" --request GET "$WEBHOOK" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/json" 2>/tmp/coolify.err)
            if http_ok "$HTTP"; then
              echo "Деплой: GET + Bearer, HTTP $HTTP"
              OK=1
            else
              echo "GET + Bearer: HTTP $HTTP, ответ: $(head -c 400 /tmp/coolify.rsp 2>/dev/null || true)"
            fi
          fi
          if [ "$OK" -eq 0 ]; then
            HTTP=$(curl -sS -o /tmp/coolify.rsp -w "%{http_code}" --request GET "$WEBHOOK" -H "Accept: application/json" 2>/dev/null)
            if http_ok "$HTTP"; then
              echo "Деплой: GET без Bearer, HTTP $HTTP"
              OK=1
            fi
          fi
          if [ "$OK" -eq 0 ] && [ -n "$TOKEN" ]; then
            API_ROOT="${WEBHOOK%%/api/v1/deploy*}"
            UUID=$(printf '%s' "$WEBHOOK" | sed -n 's/^.*[?&]uuid=\([^&?#]*\).*$/\1/p')
            if [ -n "$API_ROOT" ] && [ -n "$UUID" ]; then
              HTTP=$(curl -sS -o /tmp/coolify.rsp -w "%{http_code}" --request POST "${API_ROOT}/api/v1/deploy" \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Content-Type: application/json" \
                -H "Accept: application/json" \
                -d "{\"uuid\":\"$UUID\",\"force\":false}" 2>/dev/null)
              if http_ok "$HTTP"; then
                echo "Деплой: POST + JSON, HTTP $HTTP"
                OK=1
              else
                echo "POST: HTTP $HTTP, ответ: $(head -c 400 /tmp/coolify.rsp 2>/dev/null || true)"
              fi
            fi
          fi
          set -e
          if [ "$OK" -eq 1 ]; then
            echo "Деплой в Coolify запрошен."
            exit 0
          fi
          echo "::error::Coolify не ответил успехом. Проверь: 1) у API-токена в Coolify IP allowlist 0.0.0.0/0; 2) права *; 3) COOLIFY_DEPLOY_WEBHOOK — полный URL; 4) в секретах нет лишнего переноса строки в токене."
          exit 1
