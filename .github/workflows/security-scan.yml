# Сканирование безопасности агрегатора crs: Trivy + Semgrep.
# Реальная логика — в reusable-security-scan.yml.
# Триггеры: push в main, PR в main, еженедельно (вс 03:00 UTC).
# Результаты: Security → Code scanning alerts репо crs.

name: Security Scan (Trivy + Semgrep)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 0'   # каждое воскресенье 03:00 UTC

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-security-scan.yml
