global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ── Prometheus self-monitoring ─────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ── Host metrics (node-exporter) ───────────────────────
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # ── Docker container metrics (cAdvisor) ────────────────
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # ── PostgreSQL metrics ─────────────────────────────────
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # ── Nginx (frontend) stub_status ───────────────────────
  - job_name: nginx
    metrics_path: /nginx_status
    static_configs:
      - targets: ["frontend:80"]

  # ── HTTP /health приложений (JSON): Blackbox → метрики probe_*
  - job_name: app-health
    metrics_path: /probe
    scrape_interval: 10s
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://ai_agent:8002/health
          - http://data_backend:8004/health
          - http://suitcase_backend:8010/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
