# Необязательный оверлей: порты на хост для отладки (RAG, граф, Chroma, БД, pgAdmin).
# Использование: docker compose -f docker-compose.yml -f docker-compose.dev-ports.yaml up -d
# Хост привязки: COMPOSE_LAN_BIND (по умолчанию 127.0.0.1) — см. docker-compose.yml

services:
  postgres:
    ports:
      - "${COMPOSE_LAN_BIND:-127.0.0.1}:5545:5432"

  chromadb:
    ports:
      - "${COMPOSE_LAN_BIND:-127.0.0.1}:8010:8000"

  vectorization:
    ports:
      - "${COMPOSE_LAN_BIND:-127.0.0.1}:8001:8001"

  placesweb:
    ports:
      - "${COMPOSE_LAN_BIND:-127.0.0.1}:8003:8003"

  pgadmin:
    ports:
      - "${COMPOSE_LAN_BIND:-127.0.0.1}:5050:80"
